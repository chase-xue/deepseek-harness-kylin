name: Build Kylin OS Packages (.deb)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Kylin OS .deb Package
        run: |
          python3 tools/build_kylin_deb.py --arch ${{ matrix.arch }} --app-source ""

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-kylin-${{ matrix.arch }}
          path: dist/*.deb

      - name: Release Packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
